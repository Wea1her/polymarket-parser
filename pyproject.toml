[project]
name = "polymarket-parser"
version = "0.1.0"
description = "Polymarket 交易解析器"
requires-python = ">=3.11"
dependencies = [
    "web3>=6.15.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
